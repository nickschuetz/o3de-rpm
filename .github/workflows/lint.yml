name: lint

# Runs the cheap, no-network checks on every push/PR — spec parse, rpmlint,
# desktop-file-validate, appstream-util validate, shell syntax check.
# A full RPM build is too heavy for free runners (>2 hours, 14 GB output);
# we rely on copr-cli builds for the actual binary RPM.

on:
  push:
    branches: [main]
    paths:
      - 'o3de.spec'
      - 'sources/**'
      - 'Makefile'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'o3de.spec'
      - 'sources/**'
      - 'Makefile'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

env:
  # Opt JS-based actions into Node 24 ahead of GitHub's forced cutover
  # on 2026-06-02. See test-installed.yml's matching block for context.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Install RPM tooling
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build rpmlint rpm-devel \
            desktop-file-utils libappstream-glib \
            make bash

      - uses: actions/checkout@v4

      - name: Spec parses (stable + snapshot + stabilization + experimental modes)
        # Each spec-parse target exercises a different combination of
        # bconds (none / --with snapshot / + --with stabilization /
        # + --with system_<X>). A regression in any conditional
        # BR/Requires/cmake block surfaces here before it reaches a
        # 5-hour COPR build.
        run: make spec-parse spec-parse-stable spec-parse-snapshot spec-parse-stabilization spec-parse-experimental

      - name: rpmlint
        # The spec uses `%include %{SOURCE99}` to pull in the changelog
        # from sources/o3de.changelog. rpmlint uses python-rpm bindings
        # that don't honor _sourcedir overrides via $HOME shimming the
        # way rpmspec does, and `rpmspec -P` expands macros textually
        # inside changelog entries (corrupts them). So splice the
        # changelog inline into a tmp .spec file via awk, then lint
        # that copy. Matches the workaround in Makefile's lint target.
        run: |
          TMPDIR=$(mktemp -d /tmp/o3de.lint.XXXXXX)
          awk '/^%include %{SOURCE99}$/{ while ((getline l < "sources/o3de.changelog") > 0) print l; next } {print}' o3de.spec > $TMPDIR/o3de.spec
          cp .rpmlintrc $TMPDIR/ 2>/dev/null || true
          ( cd $TMPDIR && rpmlint o3de.spec )

      - name: Desktop entries validate
        run: desktop-file-validate sources/o3de.desktop sources/o3de-editor.desktop

      - name: AppStream metainfo validates
        run: appstream-util validate-relax --nonet sources/o3de.metainfo.xml

      - name: Shell sources have valid syntax
        run: |
          # Cover *.sh AND extensionless wrappers (e.g. o3de-cli) by
          # treating any file in sources/ whose first line is a bash/sh
          # shebang as a shell source.
          for f in sources/*; do
            [ -f "$f" ] || continue
            head -1 "$f" 2>/dev/null | grep -qE '^#!.*\b(bash|sh)\b' || continue
            bash -n "$f" && echo "    $f OK"
          done

      - name: Carry patches apply to the pinned stabilization commit
        # Applies the patches the stabilization channel declares, in the
        # order %autosetup uses and at fuzz 0, to the commit the spec pins,
        # and fails on the first one that does not apply (as %prep would).
        # Until 2026-11-01 this step looked for a bare `%global
        # snapshot_commit` line; the pin moved into `%{?!snapshot_commit:...}`
        # on 2026-05-11 (c5cdd22), so every run since skipped it. Stable (the
        # release tarball) and development (no fixed pin) are not covered
        # here; their COPR %prep is the check. A GitHub fetch failure skips
        # with a warning rather than failing the job (outage != drift).
        run: |
          PIN=$(sed -nE 's/.*%global snapshot_commit ([0-9a-f]{40}).*/\1/p' o3de.spec | head -n 1)
          if [ -z "$PIN" ]; then
            echo "::error::no 40-character snapshot_commit pin found in o3de.spec"
            exit 1
          fi
          FLAGS="--with snapshot"
          for b in $(make -s print-copr-with CHANNEL=stabilization); do
            FLAGS="$FLAGS --with $b"
          done
          PATCHES=$(rpmspec -P $FLAGS --define "_sourcedir $PWD/sources" \
            --define "_specdir $PWD" o3de.spec | sed -nE 's/^Patch[0-9]+:[[:space:]]+//p')
          if [ -z "$PATCHES" ]; then
            echo "::error::rpmspec lists no patches for the stabilization channel"
            exit 1
          fi
          dnf install -y --setopt=install_weak_deps=False git patch
          mkdir /tmp/o3de
          cd /tmp/o3de || exit 1
          git init -q
          if ! timeout 600 git fetch --depth 1 -q https://github.com/o3de/o3de.git "$PIN"; then
            echo "::warning::could not fetch o3de $PIN (network, or the commit is gone); patch check skipped"
            exit 0
          fi
          git checkout -q FETCH_HEAD
          echo "pin $PIN"
          for p in $PATCHES; do
            if ! patch -p1 --fuzz=0 -s --no-backup-if-mismatch -i "$GITHUB_WORKSPACE/sources/$p"; then
              echo "::error::$p does not apply to $PIN at fuzz 0"
              exit 1
            fi
            echo "    applied $p"
          done
