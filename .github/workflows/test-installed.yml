name: test-installed

# Test an already-built versioned O3DE RPM (o3de2605, o3de2610, ...) by
# installing it in a Fedora container and running tests/integration-test.sh
# against the result. The RPM itself is too big (~14-28 GB) to build on
# free GitHub runners — this workflow consumes a pre-built RPM URL (from
# COPR or anywhere else).
#
# The package name (and the test-script's $O3DE_PKGNAME) is auto-derived
# from the RPM filename (o3de[0-9]+-...rpm); workflow_dispatch can override
# it explicitly via the o3de_pkgname input when COPR hosts multiple majors
# in the same project.
#
# Three triggers:
#   workflow_dispatch     manual via the GitHub UI (paste an RPM URL,
#                         optionally an explicit o3de_pkgname)
#   repository_dispatch   programmatic; fired by `make trigger-tests`
#                         after a `make copr-stabilization-and-test`
#                         (or `make copr-experimental-and-test`, etc.)
#                         succeeds. event_type: copr-build-succeeded
#                         client_payload: { rpm_url, build_id }
#   schedule              cron-poll COPR every 4 hours; on a new
#                         succeeded build that's never been tested,
#                         run automatically. Polls o3de-stabilization
#                         (the community-tester channel) by default;
#                         o3de-snapshot is for one-off dev builds and
#                         doesn't need cron-driven testing. Dedup via
#                         actions/cache keyed on the COPR build_id.

on:
  workflow_dispatch:
    inputs:
      rpm_url:
        description: 'URL of the o3de RPM to test (e.g. a COPR build artifact)'
        required: true
        type: string
      run_setup:
        description: 'Run Tier 3 (per-user venv setup, downloads ~200MB)'
        required: false
        default: true
        type: boolean
      run_project:
        description: 'Run Tier 5 (create + cmake-configure a sample project)'
        required: false
        default: false
        type: boolean
      run_ui:
        description: 'Run Tier 6 UI smoke (Project Manager under Xvfb)'
        required: false
        default: true
        type: boolean
      run_ui_editor:
        description: 'Run Tier 6 with --editor (Editor scripted automation)'
        required: false
        default: false
        type: boolean
      run_asset_bake:
        description: 'Run Tier 7 (system-swap library-health check across all Stage 1 swaps; fast)'
        required: false
        default: true
        type: boolean
      o3de_pkgname:
        description: 'Explicit package name override (e.g. o3de2605). Leave blank to auto-detect from the RPM URL.'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [copr-build-succeeded]
  schedule:
    # Every 4 hours, offset to avoid the top-of-hour rush. COPR builds
    # of o3de typically take 4-5 h, so on a daily build cadence this
    # picks up new builds within ~4 h of completion.
    - cron: '17 */4 * * *'

env:
  COPR_OWNER: hellaenergy
  # The cron path polls this project for new builds. Defaults to
  # o3de-stabilization since that's the regular community-tester
  # channel; o3de-snapshot is now used for ad-hoc development-branch
  # builds and doesn't need cron-driven testing.
  COPR_PROJECT: o3de-stabilization
  # Opt JS-based actions (checkout, upload/download-artifact, cache) into
  # Node 24 ahead of GitHub's forced cutover on 2026-06-02. Surfaces any
  # Node 24 incompatibility now, on our schedule, instead of auto-flipping
  # without warning. Once Node 24 is the default everywhere we can drop
  # this; remove ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION at the same time
  # if we ever need it for a temporary opt-out.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect:
    # Resolve the RPM URL + COPR build_id according to the trigger that
    # fired the workflow, and decide whether to actually run tests
    # (a cron poll skips when the latest succeeded build has already
    # been tested in a prior run).
    runs-on: ubuntu-latest
    outputs:
      rpm_url:       ${{ steps.resolve.outputs.rpm_url }}
      build_id:      ${{ steps.resolve.outputs.build_id }}
      pkgname:       ${{ steps.resolve.outputs.pkgname }}
      should_test:   ${{ steps.decide.outputs.should_test }}
      run_setup:     ${{ steps.flags.outputs.run_setup }}
      run_project:   ${{ steps.flags.outputs.run_project }}
      run_ui:        ${{ steps.flags.outputs.run_ui }}
      run_ui_editor: ${{ steps.flags.outputs.run_ui_editor }}
      run_asset_bake: ${{ steps.flags.outputs.run_asset_bake }}
    steps:
      - name: Resolve trigger inputs
        id: resolve
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "rpm_url=${{ inputs.rpm_url }}" >> "$GITHUB_OUTPUT"
              echo "build_id=manual-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
              ;;
            repository_dispatch)
              echo "rpm_url=${{ github.event.client_payload.rpm_url }}" >> "$GITHUB_OUTPUT"
              echo "build_id=${{ github.event.client_payload.build_id }}" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              # Query COPR for the most recent succeeded build. The api_3
              # build-list endpoint takes ownername+projectname as query
              # params, not path components — the path form returns 404.
              api="https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}&limit=20"
              build_id=$(curl -fsSL "$api" | jq -r '.items | map(select(.state == "succeeded")) | .[0].id // empty')
              if [ -z "$build_id" ]; then
                echo "no succeeded builds in ${COPR_OWNER}/${COPR_PROJECT} yet"
                echo "rpm_url=" >> "$GITHUB_OUTPUT"
                echo "build_id=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Resolve the F44 RPM URL via repo metadata. The per-build
              # directory only hosts logs after rsync moves the artifacts
              # into the createrepo-managed Packages/o/ tree at the repo
              # root, so we have to look it up via repodata.
              repo="https://download.copr.fedorainfracloud.org/results/${COPR_OWNER}/${COPR_PROJECT}/fedora-44-x86_64"
              primary=$(curl -fsSL "${repo}/repodata/repomd.xml" \
                | grep -oE 'repodata/[a-f0-9]+-primary\.xml\.gz' | head -1)
              # Match versioned package names (o3de2605, o3de2610, ...).
              # When a project hosts multiple majors simultaneously, this
              # picks the alphabetically-first match in repodata order;
              # for now, that's whatever the latest succeeded build wrote.
              # Future enhancement: prefer the highest-NNNN match.
              rpm_rel=$(curl -fsSL "${repo}/${primary}" | gunzip -c \
                | grep -oE 'href="Packages/o/o3de[0-9]+-[^"]+\.x86_64\.rpm"' \
                | grep -v -- '-debug-' \
                | head -1 \
                | sed 's/^href="//; s/"$//')
              if [ -z "$rpm_rel" ]; then
                echo "could not find o3deNNNN F44 RPM in repodata at ${repo}"
                exit 1
              fi
              echo "rpm_url=${repo}/${rpm_rel}" >> "$GITHUB_OUTPUT"
              echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
              ;;
          esac

          # Resolve the versioned package name (e.g. o3de2605). Drives
          # which o3deNNNN the test scripts query post-install. Manual
          # override (workflow_dispatch input) wins; otherwise extract
          # from the RPM URL's basename — strip the leading o3deNNNN-
          # prefix from the filename, fall back to "o3de" for legacy
          # unversioned packages still floating around in COPR.
          override='${{ inputs.o3de_pkgname }}'
          rpm_url=$(grep '^rpm_url=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          if [ -n "$override" ]; then
              pkgname="$override"
          elif [ -n "$rpm_url" ]; then
              base=$(basename "$rpm_url")
              pkgname=$(printf '%s' "$base" | sed -nE 's|^(o3de[0-9]+)-.*$|\1|p')
              [ -n "$pkgname" ] || pkgname=o3de
          else
              pkgname=o3de
          fi
          echo "pkgname=${pkgname}" >> "$GITHUB_OUTPUT"

      - name: Look up dedup marker for this build (schedule only)
        id: cache
        if: github.event_name == 'schedule' && steps.resolve.outputs.build_id != ''
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.copr-tested-marker
          key: copr-build-tested-${{ steps.resolve.outputs.build_id }}
          lookup-only: true

      - name: Decide whether to run tests
        id: decide
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch|repository_dispatch)
              echo "should_test=true" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              if [ -z "${{ steps.resolve.outputs.build_id }}" ]; then
                echo "should_test=false" >> "$GITHUB_OUTPUT"
              elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
                echo "build ${{ steps.resolve.outputs.build_id }} already tested; skipping"
                echo "should_test=false" >> "$GITHUB_OUTPUT"
              else
                echo "should_test=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Resolve tier flags
        id: flags
        run: |
          set -euo pipefail
          # workflow_dispatch carries explicit booleans; the other two
          # triggers fall through to the defaults: setup + UI on,
          # project + ui-editor off (heaviest tiers stay opt-in).
          run_setup="${{ inputs.run_setup }}"
          run_project="${{ inputs.run_project }}"
          run_ui="${{ inputs.run_ui }}"
          run_ui_editor="${{ inputs.run_ui_editor }}"
          run_asset_bake="${{ inputs.run_asset_bake }}"
          [ -z "$run_setup" ]      && run_setup=true
          [ -z "$run_project" ]    && run_project=false
          [ -z "$run_ui" ]         && run_ui=true
          [ -z "$run_ui_editor" ]  && run_ui_editor=false
          # Tier 7 default OFF until the two-pass design is verified in
          # CI. The script (tests/asset-bake-test.sh) was redesigned
          # 2026-05-08 to run AP twice (cold + warm pass) so the
          # cold-cache parallel-jobs SRG-merge ordering quirk
          # (viewsrg.srgi / scenesrg.srgi not yet emitted when
          # ShaderAssetBuilder runs) gets resolved on the warm pass.
          # Pass/fail grading uses the warm-pass log. Default flips to
          # true once a manual workflow_dispatch run confirms the
          # two-pass shape works end-to-end.
          [ -z "$run_asset_bake" ] && run_asset_bake=true
          {
            echo "run_setup=$run_setup"
            echo "run_project=$run_project"
            echo "run_ui=$run_ui"
            echo "run_ui_editor=$run_ui_editor"
            echo "run_asset_bake=$run_asset_bake"
          } >> "$GITHUB_OUTPUT"

  test:
    # Each chroot in the matrix downloads the RPM directly from COPR.
    # Earlier versions of this workflow funneled the RPM through a
    # `prepare` job that stashed it as a `actions/upload-artifact@v4`
    # artifact and let each test job pull from GitHub-internal storage,
    # to save COPR-CDN egress. That flow had a probabilistic
    # corruption mode at our package size (2026-05-07: 1.75 GB) — every
    # ~50% of artifact roundtrips returned bytes that didn't match the
    # RPM header's payload digest, failing dnf install with
    # "Payload SHA256 ALT digest: BAD". Re-running the same workflow
    # against the same RPM passed cleanly. With only two chroots in
    # the matrix, two COPR downloads per CI run is cheap; with the
    # artifact roundtrip eliminated, the flake class is gone.
    needs: [detect]
    if: needs.detect.outputs.should_test == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Add more chroots as Fedora releases. Each runs the same test
        # suite against the same RPM. The chroot name doubles as the
        # display label (used in artifact names below). The image is the
        # actual container ref — registry.fedoraproject.org's `fedora`
        # repo tags by version-or-stream (44, rawhide), not by COPR's
        # chroot-style fedora-44 prefix.
        include:
          - chroot: fedora-44
            image: registry.fedoraproject.org/fedora:44
          - chroot: fedora-rawhide
            image: registry.fedoraproject.org/fedora:rawhide

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --privileged   # needed for desktop-file-validate's permission probes

    steps:
      - name: Install test prerequisites
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            sudo curl rpm dnf-plugins-core \
            desktop-file-utils libappstream-glib appstream \
            python3 cmake ninja-build vulkan-loader \
            findutils diffutils \
            xorg-x11-server-Xvfb xdpyinfo scrot xdotool wmctrl \
            mesa-vulkan-drivers
          # The integration tests need a regular user (not root) for Tiers 3-6.
          useradd -m runner

      - name: Enable hellaenergy/o3de-dependencies COPR
        # Provides the system-library packages our Stage 1 swaps depend on
        # (mikkelsen, etc.) until those land in Fedora proper. Safe no-op
        # for snapshot builds that haven't activated any swaps.
        run: dnf copr enable -y hellaenergy/o3de-dependencies

      - uses: actions/checkout@v4

      - name: Download RPM from COPR
        run: |
          curl -fsSL -o /tmp/o3de.rpm "${{ needs.detect.outputs.rpm_url }}"
          ls -lh /tmp/o3de.rpm

      - name: Install
        # No --skip-broken: a missing dep should fail loudly here (where
        # the diagnostic is "package X needed by o3de") rather than
        # silently skip the install and surface as "rpm -q o3de failed"
        # in Tier 1 of the integration tests.
        run: dnf install -y /tmp/o3de.rpm

      - name: Tier 1 + 2 (RPM-level + install integrity)
        env:
          O3DE_PKGNAME: ${{ needs.detect.outputs.pkgname }}
        run: tests/integration-test.sh

      - name: Tier 3 (user-side setup)
        if: ${{ needs.detect.outputs.run_setup == 'true' }}
        env:
          O3DE_PKGNAME: ${{ needs.detect.outputs.pkgname }}
        run: |
          chown -R runner:runner /home/runner $GITHUB_WORKSPACE
          su -l runner -c "O3DE_PKGNAME='${{ needs.detect.outputs.pkgname }}' $GITHUB_WORKSPACE/tests/integration-test.sh --setup"

      - name: Tier 5 (project end-to-end)
        if: ${{ needs.detect.outputs.run_project == 'true' }}
        env:
          O3DE_PKGNAME: ${{ needs.detect.outputs.pkgname }}
        run: |
          su -l runner -c "O3DE_PKGNAME='${{ needs.detect.outputs.pkgname }}' $GITHUB_WORKSPACE/tests/integration-test.sh --setup --with-project"

      - name: Tier 6 (UI smoke under Xvfb)
        if: ${{ needs.detect.outputs.run_ui == 'true' }}
        env:
          # Force Mesa lavapipe (software Vulkan) — no GPU in CI containers.
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          O3DE_PKGNAME: ${{ needs.detect.outputs.pkgname }}
        run: |
          chown -R runner:runner /home/runner $GITHUB_WORKSPACE
          if [ "${{ needs.detect.outputs.run_ui_editor }}" = "true" ]; then
              su -l runner -c "O3DE_PKGNAME='${{ needs.detect.outputs.pkgname }}' $GITHUB_WORKSPACE/tests/ui-smoke-test.sh --editor --screenshot"
          else
              su -l runner -c "O3DE_PKGNAME='${{ needs.detect.outputs.pkgname }}' $GITHUB_WORKSPACE/tests/ui-smoke-test.sh --screenshot"
          fi

      - name: Tier 7 (asset-bake regression; assimp 5->6 guard)
        if: ${{ needs.detect.outputs.run_asset_bake == 'true' }}
        env:
          # AssetProcessorBatch initializes the RHI even when running
          # headless, so the lavapipe ICD must be discoverable. Same
          # variable Tier 6 sets.
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          O3DE_PKGNAME: ${{ needs.detect.outputs.pkgname }}
        run: |
          chown -R runner:runner /home/runner $GITHUB_WORKSPACE
          # Tier 7 needs Tier 3 done (per-user venv); when run_setup is
          # off in workflow_dispatch, skip rather than fail.
          if [ "${{ needs.detect.outputs.run_setup }}" != "true" ]; then
              echo "Tier 7 needs Tier 3 (--setup); skipping because run_setup=false"
              exit 0
          fi
          su -l runner -c "O3DE_PKGNAME='${{ needs.detect.outputs.pkgname }}' $GITHUB_WORKSPACE/tests/asset-bake-test.sh --keep-tmp"

      - name: Upload screenshots
        if: ${{ needs.detect.outputs.run_ui == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.chroot }}
          path: /tmp/o3de-*.png
          if-no-files-found: ignore

      - name: Upload AssetProcessor log on Tier 7 failure
        if: ${{ needs.detect.outputs.run_asset_bake == 'true' && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-bake-log-${{ matrix.chroot }}
          # The bake script (with --keep-tmp) leaves its scratch
          # project plus logs under mktemp's standard location. Upload
          # BOTH cold + warm logs so investigators can diagnose
          # cold-pass-specific failures (the warm log alone misses
          # cold-cache-only events). Caught during 2026-05-11 Tier 7
          # investigation: only-warm-log uploads meant the cold-pass
          # behavior was invisible to artifact consumers.
          path: |
            /tmp/o3de-bake-test-*/asset-processor.log
            /tmp/o3de-bake-test-*/asset-processor.cold.log
          if-no-files-found: ignore

  record:
    # Only persist the dedup marker when scheduled tests succeeded
    # cleanly across all chroots. Failed builds remain testable on
    # the next cron tick (in case the failure was a flake).
    needs: [detect, test]
    if: needs.detect.outputs.should_test == 'true' && needs.test.result == 'success' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Mark this build as tested
        run: mkdir -p /tmp/.copr-tested-marker && touch /tmp/.copr-tested-marker/done
      - uses: actions/cache/save@v4
        with:
          path: /tmp/.copr-tested-marker
          key: copr-build-tested-${{ needs.detect.outputs.build_id }}
