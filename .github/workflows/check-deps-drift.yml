name: check-deps-drift

# Weekly dependency-drift check: compares the engine's
# BuiltInPackages_linux_x86_64.cmake pins against what we ship in
# hellaenergy/o3de-dependencies and what o3de/3p-package-source pins
# in build_config.json. Sticky-issues the result so a single GitHub
# issue tracks the current state: the issue is OPEN only while there is
# real drift. A clean run auto-closes it (recording the clean snapshot);
# the next run with real drift reopens the same issue rather than spawning
# a duplicate. A fetch outage (exit 2) never flips the issue's state.
# Workflow fails (red dot) when the script reports any "out-of-date" entries.

on:
  schedule:
    # 06:00 UTC every Monday. Cheap (one runner, ~30s of network calls).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # Opt JS-based actions into Node 24 ahead of GitHub's forced cutover
  # on 2026-06-02. Mirrors lint.yml / test-installed.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ISSUE_TITLE: "Dependency drift report"

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install gh + copr-cli + python
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gh copr-cli python3 git ca-certificates

      - uses: actions/checkout@v4

      - name: Configure git safe.directory for the checkout
        # `gh issue` calls git internally to detect the repo from the
        # checkout's git config. The Fedora container runs as root but
        # actions/checkout sets up the working tree under a different
        # uid, so git refuses with "dubious ownership" unless we mark
        # the path as safe. Without this, "Update sticky issue" below
        # fails before the gh call even fires.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run drift check
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 tools/check-deps-drift.py > drift-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          {
            echo "## Latest run"
            echo
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Triggered by: ${{ github.event_name }}"
            echo
            echo "---"
            echo
            cat drift-report.md
          } > issue-body.md
          cat issue-body.md
          set -e

      - name: Manage sticky issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_EXIT: ${{ steps.drift.outputs.exit_code }}
        run: |
          set -euo pipefail
          # Locate the sticky issue by exact title, authored by the actions
          # bot (login contains "github-actions"), so a manual issue with the
          # same title is never touched. Search ALL states so a previously
          # auto-closed issue can be reopened when drift returns rather than
          # spawning a duplicate.
          find_sticky() {
            gh issue list --state "$1" \
              --search "in:title \"$ISSUE_TITLE\"" \
              --json number,title,author,state \
              --jq '.[]
                    | select(.title == env.ISSUE_TITLE
                             and (.author.login | ascii_downcase | contains("github-actions")))
                    | .number' \
              | head -n1
          }
          open_issue=$(find_sticky open || true)
          any_issue=$(find_sticky all || true)

          case "${DRIFT_EXIT:-0}" in
            2)
              # Fetch outage (exit 2): not a real drift signal. Do NOT flip
              # open/closed state and do NOT create -- a transient COPR hiccup
              # must not close a live drift issue or spawn a new one. Only
              # refresh an already-open issue's body so it shows the outage.
              if [ -n "$open_issue" ]; then
                gh issue edit "$open_issue" --body-file issue-body.md
                echo "outage: refreshed open issue #$open_issue, state unchanged"
              else
                echo "outage: no open issue; left everything as-is"
              fi
              ;;
            1)
              # Real drift (exit 1): ensure an OPEN issue exists with the
              # latest report. Reopen a previously auto-closed one instead of
              # creating a duplicate.
              if [ -n "$open_issue" ]; then
                gh issue edit "$open_issue" --body-file issue-body.md
                echo "drift: updated open issue #$open_issue"
              elif [ -n "$any_issue" ]; then
                gh issue reopen "$any_issue"
                gh issue edit "$any_issue" --body-file issue-body.md
                echo "drift: reopened + updated issue #$any_issue"
              else
                gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md --label drift \
                  || gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
                echo "drift: created new sticky issue"
              fi
              ;;
            *)
              # Clean (exit 0): the dashboard should not sit perpetually open.
              # Refresh the body to the last-known-clean snapshot, then close
              # it. Never create an issue when clean.
              if [ -n "$open_issue" ]; then
                gh issue edit "$open_issue" --body-file issue-body.md
                gh issue close "$open_issue" \
                  --comment "No dependency drift as of this run; auto-closed. It will reopen automatically if drift returns."
                echo "clean: closed issue #$open_issue"
              else
                echo "clean: no open issue to close"
              fi
              ;;
          esac

      - name: Warn on fetch outage (exit 2)
        # Exit 2 means the COPR lookups failed/timed out, not real drift.
        # Don't fail the run red over an upstream API hiccup -- surface a
        # warning so the next scheduled run (or a manual re-run) settles it.
        if: steps.drift.outputs.exit_code == '2'
        run: |
          echo "::warning::dep-drift check could not reach COPR (fetch outage, exit 2); not a drift signal. Re-run when COPR is healthy."

      - name: Fail if drift detected
        # Only a real drift signal (exit 1) fails the run.
        if: steps.drift.outputs.exit_code == '1'
        run: |
          echo "::error::dependency drift detected; see the sticky issue."
          exit 1
