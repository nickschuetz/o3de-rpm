name: check-deps-drift

# Weekly dependency-drift check: compares the engine's
# BuiltInPackages_linux_x86_64.cmake pins against what we ship in
# hellaenergy/o3de-dependencies and what o3de/3p-package-source pins
# in build_config.json. Sticky-issues the result so a single GitHub
# issue tracks the current state. Workflow fails (red dot) when the
# script reports any "out-of-date" entries.

on:
  schedule:
    # 06:00 UTC every Monday. Cheap (one runner, ~30s of network calls).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # Opt JS-based actions into Node 24 ahead of GitHub's forced cutover
  # on 2026-06-02. Mirrors lint.yml / test-installed.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ISSUE_TITLE: "Dependency drift report"

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install gh + copr-cli + python
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gh copr-cli python3 git ca-certificates

      - uses: actions/checkout@v4

      - name: Run drift check
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 tools/check-deps-drift.py > drift-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          {
            echo "## Latest run"
            echo
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Triggered by: ${{ github.event_name }}"
            echo
            echo "---"
            echo
            cat drift-report.md
          } > issue-body.md
          cat issue-body.md
          set -e

      - name: Update sticky issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Find the sticky issue by exact title; create if missing.
          # We restrict the search to open issues authored by github-actions
          # so manual issues with the same title are not clobbered.
          existing=$(gh issue list \
            --state open \
            --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title,author \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' \
            | head -n1)
          if [ -z "$existing" ]; then
            echo "no existing issue, creating..."
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file issue-body.md \
              --label "drift" || \
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file issue-body.md
          else
            echo "updating issue #$existing..."
            gh issue edit "$existing" --body-file issue-body.md
          fi

      - name: Fail if drift detected
        if: steps.drift.outputs.exit_code != '0'
        run: |
          echo "::error::dependency drift detected; see the sticky issue."
          exit 1
