# dep-map.yaml -- mapping from O3DE engine package names to our COPR packages
# in hellaenergy/o3de-dependencies and to o3de/3p-package-source/<Name>/build_config.json.
#
# Used by tools/check-deps-drift.py to compare three sources of truth:
#   1) Engine pin -- BuiltInPackages_linux_x86_64.cmake on the active branch
#   2) Our COPR  -- latest-succeeded-build version in hellaenergy/o3de-dependencies
#   3) Upstream  -- build_config.json package_version in o3de/3p-package-source
#
# Update this file whenever a new package is added to or removed from the COPR.
# See tools/README.md for the full update procedure.
#
# YAML is parsed by a tiny regex-only loader in check-deps-drift.py (no PyYAML
# dependency); keep the structure flat:
#   - one "key: value" line per scalar
#   - lists use "- item" inline-prefixed entries
#   - block-mappings under top-level keys are exactly two-space indented
#   - no anchors, no flow style, no multi-line strings, no quoted keys
# If you need richer YAML, add PyYAML to the workflow image and update the
# parser (or convert this file to JSON; the script auto-detects extension).

# Active engine branch the script targets by default. The workflow can
# override this via the ENGINE_REF env var.
#
# Rolled to the 26.10-LINE base 2026-08-14: stabilization/26100 was cut
# 2026-08-11 and is the active line the stabilization + development channels
# now build (o3de2610). Drift is measured against 26100's BuiltInPackages.
# stabilization/26050 is gone (26.05.0 shipped + frozen), so this had to move.
# Roll to the next stabilization/<release> when it opens.
engine_ref: stabilization/26100

# Branch the rev_watch tripwire reads (independent of engine_ref above).
# qt6 / pyside6 live on development, not stabilization, so the watch
# targets development by default.
rev_watch_ref: development

# Rev watch: specific 3rdParty pins on rev_watch_ref that, when they move
# off a known-verified baseline rev, require a manual re-verify before our
# snapshot build trusts the new package. The script fires the tripwire on
# ANY change off baseline (turns the run red, like out-of-date) so the
# bump cannot land silently. After re-verifying, bump the baseline here to
# re-arm.
#
# Format (the tiny loader only does flat two-space maps, so each value is a
# single pipe-delimited string): "<baseline-version>|<expected-target>|<note>".
#   baseline -- the version+rev currently pinned AND verified-clean.
#   target   -- the rev we expect it to move to next (context only; the
#               watch fires on any change, not just reaching target).
#   note     -- what to re-verify when it fires.
#
# Live reason these two are watched: pyside6 ships shiboken6 with an
# insecure relative RUNPATH ($ORIGIN:./../lib) that fails Fedora %install;
# our spec carries a normalization (commit 6e76c4f). A new pyside6/qt rev
# rebuilds those binaries and can shift the rpath form, so re-check the
# rpath on the first dev-tip build after either pin moves. 3p#385 is the
# PR that bumps qt rev7->rev8 + pyside6 rev4->rev5 upstream.
rev_watch:
  qt: "6.10.2-rev8|6.10.2-rev8|rev8 verified green 2026-07-09 (build 10703057). rev8 made WaylandClient a required Qt component (needs wayland-devel BR, fix 4407305). Re-verify lrelease + shiboken6 RUNPATH on the next rev bump."
  pyside6: "6.10.2-py3.10-rev5|6.10.2-py3.10-rev5|rev5 verified green 2026-07-09 (build 10703057): bin/shiboken6 ships clean $ORIGIN, engine-side shiboken generation works, so carry-fix 6e76c4f is now a no-op/retireable. Re-verify shiboken6 RUNPATH on the next rev bump."

# Engine repo + 3p package-source repo (rarely change).
engine_repo: o3de/o3de
threep_repo: o3de/3p-package-source

# COPR project that ships our license-clean rebuilds.
copr_owner: hellaenergy
copr_project: o3de-dependencies

# Map: engine package name (the first token of the ly_associate_package
# PACKAGE_NAME, e.g. "AWSNativeSDK" from "AWSNativeSDK-1.11.288-rev1-linux")
# -> COPR source package name in hellaenergy/o3de-dependencies.
#
# Keys must match the engine name exactly (case-sensitive). A null value
# means "engine references this package but we do not ship it in COPR";
# the script will classify it as "gap" unless it is also covered by a
# %bcond_with system_<X> entry in o3de.spec (see covered_by_spec_bcond
# heuristics below).
copr_packages:
  AWSNativeSDK: o3de-AWSNativeSDK
  AwsIotDeviceSdkCpp: aws-iot-device-sdk-cpp-v2
  DirectXShaderCompilerDxc: o3de2605-dxc-spirv
  ISPCTexComp: ISPCTexComp
  PhysX: PhysX
  SPIRVCross: o3de2605-spirv-cross
  astc-encoder: astc-encoder
  aws-gamelift-server-sdk: aws-gamelift-server-sdk
  azslc: azslc
  mcpp: o3de2605-mcpp-az
  mikkelsen: mikkelsen

# Map: engine package name -> upstream o3de/3p-package-source directory.
# Most names match the engine name 1:1. List explicit entries only when
# the directory differs (e.g. lower/upper case or merged dirs). Keys not
# listed here default to the engine name itself.
threep_dirs:
  qt: Qt
  mikkelsen: mikkelsen
  ISPCTexComp: ISPCTexComp
  astc-encoder: astc-encoder

# Engine packages that are intentionally swapped for a Fedora system
# library when the matching %bcond_with system_<X> is enabled in
# o3de.spec. The script reads the live list of bconds from o3de.spec
# and uses these aliases to map engine-package -> bcond suffix.
#
# (The spec uses lowercase suffixes like system_assimp, system_dxc,
# system_freetype, system_libsamplerate, system_lua, system_lz4,
# system_mikkelsen, system_openexr, system_png, system_poly2tri,
# system_spirvcross, system_sqlite, system_tiff, system_zlib,
# system_expat. The aliases let the script translate engine names
# like SPIRVCross or DirectXShaderCompilerDxc to their bcond suffix.)
spec_bcond_aliases:
  AWSNativeSDK: ""
  AwsIotDeviceSdkCpp: ""
  DirectXShaderCompilerDxc: dxc
  Freetype: freetype
  GoogleBenchmark: googlebenchmark
  ISPCTexComp: ""
  Lua: lua
  OpenEXR: openexr
  OpenSSL: ""
  PNG: png
  PhysX: ""
  SPIRVCross: spirvcross
  SQLite: sqlite
  TIFF: tiff
  ZLIB: zlib
  tiff: tiff
  zlib: zlib
  assimp: assimp
  astc-encoder: ""
  aws-gamelift-server-sdk: ""
  azslc: ""
  expat: expat
  freetype: freetype
  googlebenchmark: googlebenchmark
  libsamplerate: libsamplerate
  lz4: lz4
  mcpp: mcpp
  mikkelsen: mikkelsen
  openimageio-opencolorio: ""
  png: png
  poly2tri: poly2tri
  pyside2: ""
  qt: ""
  squish-ccr: ""
  vulkan-validationlayers: ""

# Engine packages we deliberately do not track (multiplatform header-only
# libraries, build-tooling-only deps, etc). The script silently skips these.
ignore_engine_packages:
  - RapidJSON
  - RapidXML
  - pybind11
  - glad
  - xxhash
  - cityhash

# Engine packages intentionally bundled (Bundling Library Exception filings
# in BUNDLED_LIBRARIES.md) -- not in COPR, not behind a spec bcond, BUT
# documented as deliberately bundled with rationale. The drift script
# classifies these as `bundled-exception` rather than `gap` so the report
# distinguishes "investigate this" from "documented + accepted".
#
# Add entries here when they get a BUNDLED_LIBRARIES.md justification.
# Remove entries when they get a system swap (move to copr_packages /
# spec_bcond_aliases) or get added to the engine's BR/Requires as system
# library.
bundling_exception:
  # Notes per entry (kept above each item since the tiny YAML loader
  # doesn't strip inline `#` comments):
  # OpenSSL: Stage 4 -- EOL 1.1.1t needs upstream migration to 3.x.
  - OpenSSL
  # openimageio-opencolorio: Stage 2b -- blocked on Stage 3 Python
  # migration (Python C Module ABI must match editor's embedded Python).
  - openimageio-opencolorio
  # pyside2: tied to bundled Python; will substitute when editor moves
  # to system Python. (26.05 line.)
  - pyside2
  # pyside6: 26.10 line -- bundled (runtime-only Qt-for-Python; powers the
  # QtForPython gem + DccScriptingInterface). Two walls: built against bundled
  # CPython 3.10 (Fedora python3-pyside6 is for 3.13), AND it links the bundle's
  # major-scoped libQt6Core.so.6(Qt_6_PRIVATE_API) which Fedora's Qt6 does not
  # export (minor-scopes to Qt_6.11_PRIVATE_API). The second wall is why qt6 is
  # bundled too (see qt below). Substitutes after Option B / Stage-3 Python.
  - pyside6
  # qt: 26.10 line -- Qt6 6.10.2 BUNDLED (reverted from the system_qt6 swap
  # 2026-08-17). The swap is implemented + default-off but blocked for shipping
  # by the bundled pyside6's Qt_6_PRIVATE_API pin above (a system-Qt6 RPM was
  # uninstallable on clean Fedora). o3de-qt5 (Qt5) is the 26.05-line COPR
  # package, not the 26.10 deliverable, so it is no longer in copr_packages.
  # Restore path: Option B (rebuild pyside6 against system Qt6). o3de/o3de#19081.
  - qt
  # squish-ccr: restricted -- BC7 patent encumbrance (Fedora cannot ship).
  - squish-ccr
  # vulkan-validationlayers: newer in Fedora than engine pin; needs O3DE
  # loader-interaction verification before flipping.
  - vulkan-validationlayers

# Engine packages whose COPR version intentionally diverges from the
# engine pin, with a documented reason. Classified `accepted-drift`
# (informational) instead of `out-of-date` (which fails the run). Use
# this for known-and-justified gaps, NOT to silence real drift.
accepted_drift:
  # (empty) qt moved to bundling_exception 2026-08-17: the 26.10 engine uses
  # Qt6 6.10.2 which we now BUNDLE (system_qt6 swap blocked by pyside6's
  # Qt_6_PRIVATE_API pin), so it is no longer a COPR accepted-drift entry.
  # o3de-qt5 (Qt5, 26.05 line) is out of scope for the 26.10 engine_ref.
  # Add entries here only for a real COPR-shipped package whose version
  # intentionally diverges from the engine pin.
